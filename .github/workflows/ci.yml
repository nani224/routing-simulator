name: PHANTOMNET & RouteLab CI

on:
  push:
    branches: [main, dev, phantomnet, "feature/**"]
  pull_request:
    branches: [main, dev, phantomnet]

jobs:
  verify:
    name: Full Pipeline Verification (make verify)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Strict Typecheck
        run: |
          mypy --strict backend/routelab backend/phantomnet

      - name: Run Test Suite (Unit, Property, Determinism, Soak)
        run: |
          pytest -v backend/tests/

      - name: Run Frontend Typecheck and Build
        working-directory: frontend
        run: npm run build
